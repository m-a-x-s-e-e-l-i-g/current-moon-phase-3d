version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # SvelteKit 3.2 declares a TypeScript 6 peer dependency.
      - dependency-name: 'typescript'
        versions: ['7.x']
